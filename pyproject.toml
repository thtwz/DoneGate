[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donegate"
version = "0.4.1"
description = "Track project progress, requirement changes, and verified software delivery"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
authors = [
  { name = "Hermes Agent" }
]

[project.optional-dependencies]
mcp = ["mcp>=1.9.0"]
test = ["pytest>=8.0"]

[project.scripts]
donegate = "donegate_mcp.cli.main:main"
donegate-mcp = "donegate_mcp.cli.main:main"
donegate-mcp-serve = "donegate_mcp.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"donegate_mcp.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

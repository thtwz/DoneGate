<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DoneGate · 开发交付看板</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到内容</a>
  <aside class="sidebar" aria-label="项目导航">
    <a class="brand" href="/" data-nav><span class="brand-mark" aria-hidden="true">D<span>✓</span></span><span>DoneGate<small>开发交付看板</small></span></a>
    <a class="portfolio-link nav-item" href="/" data-nav><span aria-hidden="true">▦</span> 所有项目</a>
    <div class="sidebar-heading"><span>工作空间</span><span id="project-count">0</span></div>
    <nav id="project-nav" aria-label="已登记项目"><p class="sidebar-empty">正在加载项目…</p></nav>
    <button class="add-project secondary" type="button" data-action="add"><span aria-hidden="true">＋</span> 添加项目</button>
    <div class="sidebar-footer"><span class="live-dot" aria-hidden="true"></span> 本地工作空间<small>每 5 秒自动刷新</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div id="breadcrumb">工作空间 / 所有项目</div><div class="refresh-state"><span id="refresh-status" role="status">正在连接</span><button class="icon-button" type="button" data-action="refresh" aria-label="立即刷新" title="立即刷新">↻</button></div></header>
    <main id="main" tabindex="-1">
      <div id="notice" role="status"></div>
      <div id="page-heading"></div>
      <nav id="view-tabs" class="view-tabs" aria-label="项目视图" hidden></nav>
      <div id="filter-bar" class="filter-bar" hidden>
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="task-search" type="search" placeholder="搜索功能、任务编号或需求文档" aria-label="搜索功能、任务编号或需求文档"></label>
        <label class="status-filter">状态 <select id="status-filter"><option value="all">全部状态</option><option value="needs_revalidation">需要重新验证</option><option value="draft">草稿</option><option value="ready">待开始</option><option value="in_progress">进行中</option><option value="awaiting_verification">待验证</option><option value="verified">已验证</option><option value="documented">文档已同步</option><option value="done">已完成</option><option value="blocked">已阻塞</option></select></label>
        <span id="filter-count" class="muted"></span>
      </div>
      <div id="content" aria-busy="true"><div class="empty-state"><div class="loading-mark" aria-hidden="true"></div><h2>正在读取工作空间</h2><p>载入项目、任务与需求记录…</p></div></div>
    </main>
    <footer class="page-footer">DoneGate <span>从需求到验证，让交付有据可循。</span></footer>
  </div>
  <dialog id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <div class="dialog-heading"><div><span class="eyebrow">工作空间</span><h2 id="dialog-title">添加项目</h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">×</button></div>
      <p class="muted">登记已初始化的 DoneGate 项目。路径指向运行此服务的电脑。</p>
      <label class="form-label" for="repo-root">仓库绝对路径 <span aria-hidden="true">*</span></label><input id="repo-root" name="repo_root" required autocomplete="off" spellcheck="false" placeholder="/Users/you/projects/my-app">
      <label class="form-label" for="data-root">自定义数据目录 <span class="muted">可选</span></label><input id="data-root" name="data_root" autocomplete="off" spellcheck="false" placeholder="留空使用项目默认数据目录">
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="secondary" data-action="close-dialog">取消</button><button id="submit-project" class="primary" type="submit">添加项目</button></div>
    </form>
  </dialog>
  <dialog id="remove-dialog" aria-labelledby="remove-title">
    <form id="remove-form"><div class="dialog-heading"><h2 id="remove-title">移除项目登记</h2></div><p id="remove-description"></p><p class="muted">仅从此看板移除登记，仓库、任务和证据文件都会保留。</p><p id="remove-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" data-action="cancel-remove">取消</button><button id="submit-remove" type="submit" class="danger-button">移除登记</button></div></form>
  </dialog>
</body>
</html>
